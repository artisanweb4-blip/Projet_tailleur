<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | SaaS Tailleur</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .card-custom {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            background: #ffffff;
        }
        .form-control {
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease-in-out;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }
        .input-group-text {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            border-radius: 0.5rem 0 0 0.5rem;
            color: #64748b;
        }
        .input-group .form-control {
            border-radius: 0 0.5rem 0.5rem 0;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            border: none;
            border-radius: 0.625rem;
            padding: 0.875rem 1.5rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
            transition: all 0.2s ease;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.45);
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                
                <!-- Brand Logo / Title Above Card -->
<div class="text-center text-white mb-4">
    <a href="{% url 'core:connexion' %}" class="text-white text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
        <i class="fa-solid fa-scissors fa-2x text-warning"></i>
        <span class="h3 fw-bold m-0">Atelier Tailleur</span>
    </a>
</div>

                <!-- Card de Connexion -->
                <div class="card card-custom p-3 p-sm-4">
                    <div class="card-body">
                        
                        <!-- En-tête -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-dark h4">Connexion</h2>
                            <p class="text-muted small">Accédez à votre espace de gestion</p>
                        </div>

                        <!-- Display Django Messages -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="post" novalidate>
                            {% csrf_token %}

                            <!-- Nom d'utilisateur -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold text-secondary small">Nom d'utilisateur</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" id="username" class="form-control" placeholder="Entrez votre nom d'utilisateur" required>
                                </div>
                            </div>

                            <!-- Mot de passe -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold text-secondary small">Mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- Options supplémentaires -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" name="remember" id="remember" class="form-check-input">
                                    <label for="remember" class="form-check-label text-secondary small">Se souvenir de moi</label>
                                </div>
                            </div>

                            <!-- Bouton de connexion -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-custom text-white btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                                </button>
                            </div>
                        </form>

                        <!-- Pied de carte -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-muted small">Pas encore de compte ?</span>
                            <a href="{% url 'core:inscription_saas' %}" class="fw-bold text-decoration-none ms-1" style="color: #4f46e5;">Créer un atelier</a>
                        </div>

                    </div>
                </div>

                <!-- Copyright -->
                <div class="text-center text-white-50 small mt-4">
                    &copy; SaaS Tailleur. Tous droits réservés.
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
