<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Tailleur Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ccd3f1 0%, #d6cce0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 1.5rem;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-scissors fs-1 text-primary"></i>
                            <h2 class="mt-2 fw-bold">Tailleur Pro</h2>
                            <p class="text-muted">Créez votre compte</p>
                        </div>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <input type="text" name="username" id="username" class="form-control form-control-lg rounded-pill" placeholder="Nom d'utilisateur" required>
                                {% if form.username.errors %}
                                    <div class="text-danger small mt-1">{{ form.username.errors.0 }}</div>
                                {% endif %}
                            </div>
                            <div class="mb-3">
                                <input type="email" name="email" id="email" class="form-control form-control-lg rounded-pill" placeholder="Email (optionnel)">
                            </div>
                            <div class="mb-3">
                                <input type="password" name="password1" id="password1" class="form-control form-control-lg rounded-pill" placeholder="Mot de passe" required>
                                {% if form.password1.errors %}
                                    <div class="text-danger small mt-1">{{ form.password1.errors.0 }}</div>
                                {% endif %}
                            </div>
                            <div class="mb-3">
                                <input type="password" name="password2" id="password2" class="form-control form-control-lg rounded-pill" placeholder="Confirmer le mot de passe" required>
                                {% if form.password2.errors %}
                                    <div class="text-danger small mt-1">{{ form.password2.errors.0 }}</div>
                                {% endif %}
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">S'inscrire</button>
                        </form>
                        <hr class="my-4">
                        <p class="text-center mb-0">Déjà inscrit ? <a href="{% url 'connexion' %}" class="text-decoration-none">Connectez-vous</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
